project_id = "voxi"

[api]
enabled = true
port = 54321
# PostgREST exposes only `public` by default. Voxi lives in `voxi`, so it must
# be listed here for local dev — and added under Settings > API > Exposed
# schemas on the hosted project.
schemas = ["public", "voxi"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "voxi://"]
jwt_expiry = 3600
enable_refresh_token_rotation = true

[auth.email]
enable_signup = true
enable_confirmations = false

[studio]
enabled = true
port = 54323
